# Выпускная работа. Специализация DevSecOps.
# Константин Певцов
#
# За основу взят репозиторий https://github.com/googlecloudplatform/microservices-demo
# 1. Сделан форк всех веток (для более глубокого поиска секретов)
# 2. Включены Issues (для owasp zap)
# 3. Отключены родные пайплайны (чтобы не мешались)
#
# Изначальный проект настроен на сборку в Google Kubernetes Engine.
# В выпускной работе GKE не используется.
#
# Этапы:
# 1. Поиск секретов, анализ конфигурации Kubernetes (Gitleaks, Trivy)
# 2. SAST анализ (Trivy, Semgrep)
# 3. Сборка образов для докера и их проверка (Trivy, Hadolint)
# 4. DAST анализ (OWASP Zap)
# 5. Блокировка деплоя при наличии критических уязвимостей
# 6. Деплой (сборка контейнеров в Github Actions и копирование на сервер только сжатых образов)
#
# В статическом анализе (SAST) нет разделения по проектам и по языкам. 
# Анализируется весь репозиторий, включающий все исходники.
#

name: Online Boutique DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  ###############################################################
  # Поиск секретов
  secrets:
    runs-on: ubuntu-24.04
    steps:
      # Скачивание кода
      - name: Checkout full history code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # вся история

      # Проверка репозитория на секреты. Gitleaks
      - name: Secrets searching (Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Проверка репозитория на секреты. Trivy
      - name: Secrets searching (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scanners: 'secret'
          format: 'sarif'
          output: 'trivy-secrets-results.sarif'
          severity: 'CRITICAL,HIGH'

      # Выгрузка результатов в GitHub Code Scanning
      - name: Upload secrets (Trivy)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-secrets-results.sarif'
          category: 'trivy-secrets'
          
      # Сохранение отчета в CI Артефакты
      - name: Upload secrets to artifact (Trivy)
        uses: actions/upload-artifact@v7
        with:
          name: trivy-secrets-results
          path: trivy-secrets-results.sarif
          retention-days: 7          

      # Проверка конфигураций Kubernetes и Helm
      - name: Audit Kubernetes & Helm configurations (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          format: 'sarif'
          output: 'trivy-iac-results.sarif'

      # Выгрузка результатов в GitHub Code Scanning
      - name: Upload IaC misconfigurations (Trivy)
        uses: github/codeql-action/upload-sarif@v4        
        with:
          sarif_file: 'trivy-iac-results.sarif'
          category: 'trivy-iac'

      # Сохранение отчета в CI Артефакты
      - name: Upload IaC misconfigurations to artifact (Trivy)
        uses: actions/upload-artifact@v7
        with:
          name: trivy-iac-results
          path: trivy-iac-results.sarif
          retention-days: 7    
          
  ###############################################################
  # Статический анализ (SAST Trivy)
  sast_trivy:
    runs-on: ubuntu-24.04
    needs: secrets
    steps:
      # Скачивание кода
      - name: Checkout code
        uses: actions/checkout@v7

      # Сканирование исходного кода. Trivy.
      - name: SAST (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scanners: 'vuln,misconfig'
          format: 'sarif'
          output: 'trivy-sast-results.sarif'
          exit-code: '0'

      # Выгрузка результатов в GitHub Code Scanning
      - name: Upload SAST Results (Trivy)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-sast-results.sarif'
          category: 'trivy-sast-results'

      # Сохранение отчета в CI Артефакты (Trivy)
      - name: Upload SAST Results (Trivy)
        uses: actions/upload-artifact@v7
        with:
          name: trivy-sast-results
          path: trivy-sast-results.sarif
          retention-days: 7

  ###############################################################
  # Статический анализ (SAST Semgrep)
  sast_semgrep:
    runs-on: ubuntu-24.04
    needs: secrets
    container:
      image: semgrep/semgrep:latest
    steps:
      # Скачивание кода
      - name: Checkout code
        uses: actions/checkout@v7

      # Сканирование исходного кода. Semgrep.
      - name: SAST (Semgrep)
        run: semgrep scan --config=p/ci --sarif --output=semgrep-sast-results.sarif      

      # Выгрузка результатов в GitHub Code Scanning
      - name: Upload SAST Results (Semgrep)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep-sast-results.sarif
          category: semgrep-sast-results

      # Сохранение отчета в CI Артефакты (Semgrep)
      - name: Upload SAST Results (Semgrep)
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-sast-results
          path: semgrep-sast-results.sarif
          retention-days: 7

  ###############################################################
  # Сборка и сканирование контейнеров
  build_and_scan_images:
    needs: [sast_trivy, sast_semgrep]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # список сервисов задан через отдельный список
      # структура расположения исходников сервисов одна. немного отличается только cartservice
      matrix:
        service: [
          "adservice",
          "cartservice",
          "checkoutservice",
          "currencyservice",
          "emailservice",
          "frontend",
          "paymentservice",
          "productcatalogservice",
          "recommendationservice",
          "shippingservice"
        ]      
    steps:
      # Скачивание кода
      - name: Checkout code
        uses: actions/checkout@v7

      # Сборка Docker-образа
      - name: Build Docker Image
        run: |
          # у cartservice - Dockerfile находится в ./src/${{ matrix.service }}/src, у остальных - в ./src/${{ matrix.service }}
          cd ${{ matrix.service == 'cartservice' && 'src/cartservice/src' || format('src/{0}', matrix.service) }}
          docker build -t ${{ matrix.service }}:${{ github.sha }} .

      # Сканирование уязвимостей в контейнере
      - name: Container Scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ matrix.service }}:${{ github.sha }}'
          scan-type: 'image'
          format: 'sarif'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'          
          output: '${{ matrix.service }}-trivy-image-results.sarif'
          exit-code: '0'

      # Выгрузка результатов в GitHub Code Scanning
      - name: Upload Image Results (Trivy)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: '${{ matrix.service }}-trivy-image-results.sarif'
          category: '${{ matrix.service }}-trivy-image'

      # Сохранение отчета в CI Артефакты
      - name: Upload Image Results (Trivy)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.service }}-trivy-image-results
          path: ${{ matrix.service }}-trivy-image-results.sarif
          retention-days: 7          
          
      # Проверка Dockerfile на best practices
      - name: Lint Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          # у cartservice - Dockerfile находится в ./src/${{ matrix.service }}/src, у остальных - в ./src/${{ matrix.service }}       
          dockerfile: ${{ matrix.service == 'cartservice' && 'src/cartservice/src/Dockerfile' || format('src/{0}/Dockerfile', matrix.service) }}
          format: sarif
          output-file: hadolint-${{ matrix.service }}.sarif
          no-fail: true

      # Выгрузка результатов в GitHub Code Scanning
      - name: Upload Results (Hadolint)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'hadolint-${{ matrix.service }}.sarif'
          category: 'hadolint-${{ matrix.service }}'

      # Сохранение отчета в CI Артефакты
      - name: Upload Results (Hadolint)
        uses: actions/upload-artifact@v7
        with:
          name: hadolint-${{ matrix.service }}
          path: hadolint-${{ matrix.service }}.sarif
          retention-days: 7

  ###############################################################
  # Динамический анализ (DAST)
  dast:
    runs-on: ubuntu-24.04    
    needs: build_and_scan_images
    permissions:
      # разрешение на запись в issues для owasp zap
      issues: write
    steps:
      # Скачивание кода
      - name: Checkout Code
        uses: actions/checkout@v7

      # После многочисленных экспериментов и чтения исходников, пришел к такому решению, чтобы не использовать kubernetes.
      # Вручную создается docker-compose.yml и запускается через docker compose.
      # Создается минимально необходимый список из служб, чтобы заработал frontend
      # Именно frontend и тестируется с помощью owasp zap

      - name: Generate Docker Compose File
        run: |
          cat <<EOF > docker-compose.yml
          version: '3.8'
          services:
            redis-cart:
              image: redis:7-alpine
              ports:
                - "6379"

            productcatalogservice:
              build:
                context: ./src/productcatalogservice
              ports:
                - "3550:3550"

            currencyservice:
              build:
                context: ./src/currencyservice
              ports:
                - "7000:7000"

            cartservice:
              build:
                context: ./src/cartservice/src
              ports:
                - "7070:7070"
              environment:
                - REDIS_ADDR=redis-cart:6379
              depends_on:
                - redis-cart

            frontend:
              build:
                context: ./src/frontend
              ports:
                - "8080:8080"
              environment:
                - PORT=8080
                - ENV_PLATFORM=local
                # Перенаправляем обязательные gRPC сервисы на реальные контейнеры
                - PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550
                - CURRENCY_SERVICE_ADDR=currencyservice:7000
                - CART_SERVICE_ADDR=cartservice:7070
                # Остальные второстепенные сервисы пускаем на любой живой порт, чтобы не было паники
                - RECOMMENDATION_SERVICE_ADDR=productcatalogservice:3550
                - SHIPPING_SERVICE_ADDR=productcatalogservice:3550
                - CHECKOUT_SERVICE_ADDR=productcatalogservice:3550
                - AD_SERVICE_ADDR=productcatalogservice:3550
                - SHOPPING_ASSISTANT_SERVICE_ADDR=productcatalogservice:3550
              depends_on:
                - productcatalogservice
                - currencyservice
                - cartservice
          EOF
      # Сборка и запуск докер образов с помощью docker compose
      - name: Start frontend
        run: |
          docker compose up -d --build
          echo "Waiting for frontend"
          sleep 15

      # Проверка, что frontend запустился
      # если не работает - сразу же блокировка пайплайна 
      - name: Verify frontend
        run: |
          curl -I http://localhost:8080 || exit 1

      # Локальный DAST-анализ с помощью OWASP ZAP
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://localhost:8080'
          fail_action: false
          cmd_options: '-a'
          artifact_name: zap-scan

      # Очистка ресурсов
      - name: Stop Infrastructure
        run: docker compose down        
          
  ###############################################################
  # Блокировка релиза
  security_gateway:
    runs-on: ubuntu-24.04
    needs: [build_and_scan_images, dast]
    steps:
      # Скачивание результатов SAST из CI артефактов (Trivy)
      - name: Download Artifact (Trivy)
        uses: actions/download-artifact@v8
        with:
          name: trivy-sast-results
          path: ./reports

      # Скачивание результатов SAST из CI артефактов (Semgrep)
      - name: Download Artifact (Semgrep)
        uses: actions/download-artifact@v8
        with:
          name: semgrep-sast-results
          path: ./reports

      # Скачивание секретов из CI артефактов (Trivy)
      - name: Download Secrets (Trivy)
        uses: actions/download-artifact@v8
        with:
          name: trivy-secrets-results
          path: ./reports

      # Скачивание ошибок конфигураций из CI артефактов
      - name: Download IaC (Trivy)
        uses: actions/download-artifact@v8
        with:
          name: trivy-iac-results
          path: ./reports

      # Проверка на наличие уязвимостей
      # проверка происходит через поиск слова CRITICAL в тексте отчетов. :)
      - name: Verify
        run: |
          echo "Проверка критических уязвимостей"
          
          # Проверяем файлы отчетов SAST на наличие критических уязвимостей
          if grep -q "CRITICAL" ./reports/trivy-sast-results.sarif; then
            echo "GATE_STATUS=FAILED" >> $GITHUB_ENV
            echo "::error::Релиз заблокирован! Обнаружены критические уязвимости (CRITICAL) в коде или зависимостях. (Trivy)"
          else
            echo "GATE_STATUS=PASSED" >> $GITHUB_ENV
          fi

          if grep -q "CRITICAL" ./reports/semgrep-sast-results.sarif; then
            echo "GATE_STATUS=FAILED" >> $GITHUB_ENV
            echo "::error::Релиз заблокирован! Обнаружены критические уязвимости (CRITICAL) в коде или зависимостях. (Semgrep)"
          else
            echo "GATE_STATUS=PASSED" >> $GITHUB_ENV
          fi

          if grep -q "CRITICAL" ./reports/trivy-secrets-results.sarif; then
            echo "GATE_STATUS=FAILED" >> $GITHUB_ENV
            echo "::error::Релиз заблокирован! Обнаружены секреты в репозитории. (Trivy)"
          else
            echo "GATE_STATUS=PASSED" >> $GITHUB_ENV
          fi

          if grep -q "CRITICAL" ./reports/trivy-iac-results.sarif; then
            echo "GATE_STATUS=FAILED" >> $GITHUB_ENV
            echo "::error::Релиз заблокирован! Обнаружены проблемы в конфигурации. (Trivy)"
          else
            echo "GATE_STATUS=PASSED" >> $GITHUB_ENV
          fi

      # Создание отчета
      - name: Create report
        if: env.GATE_STATUS == 'FAILED'
        run: |
          echo "### В резкльтате проверки кода были найдены критические уязвимости" > summary.md
          echo "- Время обновления: %NOW%" >> summary.md
          echo "- Исправить код помогут выгруженные артефакты (логи) и гугл. " > comments.md
          
      # Комментарии в PR
      - name: Update
        if: env.GATE_STATUS == 'FAILED'
        uses: mshick/add-pr-comment@v3
        with:
          message-id: qa-summary-report
          message-path: summary.md
          attach-path: comments.md
          refresh-message-position: true
           
     # Блокировка выполнения
      - name: Block
        if: env.GATE_STATUS == 'FAILED'
        run: |
          echo "Остановка пайплайна из-за критических уязвимостей"
          exit 1            

  ###############################################################
  # Деплой
  deploy:
    runs-on: ubuntu-24.04
    needs: security_gateway
    steps:
      - name: Deploy
        run: |
          echo "Проверки пройдены - делаем деплой"

      # Скачивание кода
      - name: Checkout Code
        uses: actions/checkout@v7
      
      # Настройка docker buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Сборка контейнеров и сжатие в tar
      - name: Build and Export Images
        run: |
          mkdir -p ./images
          
          # сборка контейнеров
          docker buildx build --load -t frontend:latest ./src/frontend
          docker buildx build --load -t cartservice:latest ./src/cartservice/src
          docker buildx build --load -t productcatalogservice:latest ./src/productcatalogservice
          docker buildx build --load -t currencyservice:latest ./src/currencyservice
          docker buildx build --load -t recommendationservice:latest ./src/recommendationservice
          docker buildx build --load -t adservice:latest ./src/adservice
          docker buildx build --load -t loadgenerator:latest ./src/loadgenerator
          docker buildx build --load -t paymentservice:latest ./src/paymentservice
          docker buildx build --load -t shippingservice:latest ./src/shippingservice
          docker buildx build --load -t emailservice:latest ./src/emailservice
          docker buildx build --load -t checkoutservice:latest ./src/checkoutservice
          
          # Сжатие в tar
          docker save frontend:latest -o ./images/frontend.tar
          docker save cartservice:latest -o ./images/cartservice.tar
          docker save productcatalogservice:latest -o ./images/sproductcatalogservice.tar
          docker save currencyservice:latest -o ./images/currencyservice.tar
          docker save recommendationservice:latest -o ./images/recommendationservice.tar
          docker save adservice:latest -o ./images/adservice.tar
          docker save loadgenerator:latest -o ./images/loadgenerator.tar
          docker save paymentservice:latest -o ./images/paymentservice.tar
          docker save shippingservice:latest -o ./images/shippingservice.tar
          docker save emailservice:latest -o ./images/emailservice.tar
          docker save checkoutservice:latest -o ./images/checkoutservice.tar
      
      # Подготовка на стороне сервера 1 (создание целевой папки)
      - name: Prepare server side 1
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            TARGET_DIR="/root/microservices-demo"

            if [ ! -d "$TARGET_DIR" ]; then
              mkdir -p "$(dirname "$TARGET_DIR")"
            fi

      # Копирование файлов на сервер
      - name: Copy files to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "images/*.tar"
          target: "/root/microservices-demo"

      # Подготовка на стороне сервера 2 (создание docker-compose.yml)
      - name: Prepare server side 2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # redis скачивается из dockerhub. остальные контейнеры - локальные
          script: |
            cd /root/microservices-demo

            cat <<EOF > docker-compose.yml
            version: '3.8'
            services:
              redis-cart:
                image: redis:7-alpine
                container_name: redis-cart
                ports:
                  - "6379"
  
              frontend:
                image: frontend:latest
                pull_policy: never
                ports:
                  - "8080:8080"
                environment:
                  - PORT=8080
                  - ENV_PLATFORM=local
                  - PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550
                  - CURRENCY_SERVICE_ADDR=currencyservice:7000
                  - CART_SERVICE_ADDR=cartservice:7070
                  - RECOMMENDATION_SERVICE_ADDR=recommendationservice:8080
                  - SHIPPING_SERVICE_ADDR=shippingservice:50051
                  - CHECKOUT_SERVICE_ADDR=checkoutservice:5050
                  - AD_SERVICE_ADDR=adservice:9555
                  - SHOPPING_ASSISTANT_SERVICE_ADDR=productcatalogservice:8080
                depends_on:
                  - productcatalogservice
                  - currencyservice
                  - cartservice
                  - recommendationservice
                  - shippingservice
                  - checkoutservice
                  - adservice                
  
              productcatalogservice:
                image: productcatalogservice:latest
                pull_policy: never
  
              currencyservice:
                image: currencyservice:latest
                pull_policy: never
  
              cartservice:
                image: cartservice:latest
                pull_policy: never
                environment:
                  - REDIS_ADDR=redis-cart:6379
                depends_on:
                  - redis-cart
  
              recommendationservice:
                image: recommendationservice:latest
                pull_policy: never
                environment:
                  - PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550
                depends_on:
                  - productcatalogservice                
  
              adservice:
                image: adservice:latest
                pull_policy: never
  
              loadgenerator:
                image: loadgenerator:latest
                pull_policy: never
                environment:
                  - FRONTEND_ADDR=frontend:8080
                depends_on:
                  - frontend
  
              paymentservice:
                image: paymentservice:latest
                pull_policy: never
            
              shippingservice:
                image: shippingservice:latest
                pull_policy: never
            
              emailservice:
                image: emailservice:latest
                pull_policy: never
            
              checkoutservice:
                image: checkoutservice:latest
                pull_policy: never
                environment:
                  - PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice:3550
                  - CURRENCY_SERVICE_ADDR=currencyservice:7000
                  - CART_SERVICE_ADDR=cartservice:7070
                  - PAYMENT_SERVICE_ADDR=paymentservice:50051
                  - SHIPPING_SERVICE_ADDR=shippingservice:50051
                  - EMAIL_SERVICE_ADDR=emailservice:8080
                depends_on:
                  - productcatalogservice
                  - currencyservice
                  - cartservice
                  - paymentservice
                  - shippingservice
                  - emailservice
            EOF

      # Загрузка контейненров в docker и запуск
      - name: Load images and run
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/microservices-demo
            
            # Загрузка tar-архивов в docker сервера
            for f in images/*.tar; do
               docker load -i "$f"
            done
            
            # запуск
            docker compose up -d
            
            # удаление tar файлов
            rm -rf images/

